extends: default

ignore: |
  .venv/
  # Vendored upstream file, kept byte-identical (checksum in cluster/versions.env).
  cluster/addons/metrics-server/components.yaml

rules:
  document-start: disable
  line-length:
    max: 120
  truthy:
    # GitHub Actions uses the bare key `on:`.
    allowed-values: ["true", "false", "on"]
  comments:
    min-spaces-from-content: 1
