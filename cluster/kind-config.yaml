# kind cluster for the fault library (and the evals later). Created by `make cluster`
# as cluster "triage", so the kube context is kind-triage.
#
# Node image: kind v0.33.0's own default, digest included, copied from
# sigs.k8s.io/kind@v0.33.0/pkg/apis/config/defaults/image.go. Bump it together with
# KIND_VERSION and KUBECTL_VERSION in cluster/versions.env.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
