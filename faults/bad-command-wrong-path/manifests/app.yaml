apiVersion: v1
kind: Namespace
metadata:
  name: ledger
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker
  namespace: ledger
data:
  worker.py: |
    import time

    while True:
        print("reconciled ledger batch", flush=True)
        time.sleep(30)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ledger
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: public.ecr.aws/docker/library/python:3.12.12-alpine
          command: ["python", "/app/worker.py"]
          volumeMounts:
            - name: code
              mountPath: /opt/worker
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: code
          configMap:
            name: worker
