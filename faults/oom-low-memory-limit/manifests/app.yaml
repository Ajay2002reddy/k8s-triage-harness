apiVersion: v1
kind: Namespace
metadata:
  name: reports
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: reports
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: public.ecr.aws/docker/library/python:3.12.12-alpine
          command: ["python", "-c"]
          args:
            - |
              import time
              print("loading monthly export", flush=True)
              export = b"x" * (256 * 1024 * 1024)
              print(f"loaded {len(export)} bytes; building report", flush=True)
              time.sleep(3600)
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 64Mi
