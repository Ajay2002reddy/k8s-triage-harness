apiVersion: v1
kind: Namespace
metadata:
  name: billing
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: billing
data:
  database_host: postgres.billing.svc.cluster.local
  database_name: invoices
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: billing
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: public.ecr.aws/docker/library/nginx:1.30.2-alpine
          ports:
            - name: http
              containerPort: 80
          env:
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: api-settings
                  key: database_host
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: api-settings
                  key: database_name
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: billing
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 80
