apiVersion: v1
kind: Namespace
metadata:
  name: orders
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: orders
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: public.ecr.aws/docker/library/nginx:1.30.2-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: orders
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: orders
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      dnsPolicy: Default
      containers:
        - name: worker
          image: public.ecr.aws/docker/library/busybox:1.37.0
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                if wget -q -T 3 -O /dev/null http://api.orders.svc.cluster.local/; then
                  echo "sync with api ok"
                else
                  echo "sync with api failed"
                fi
                sleep 5
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
