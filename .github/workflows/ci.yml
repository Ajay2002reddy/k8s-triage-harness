name: ci

# Every push, any branch: kind only runs in CI (ADR-001), and a push run also provides
# the checks on a pull request from this repo, so there is no separate pull_request run.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint + test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          enable-cache: true
      - run: make setup
      - run: make lint
      - run: make test
      - name: Install pinned Go tools (checksum-verified)
        run: |
          make tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make validate

  kind-smoke:
    name: kind smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          enable-cache: true
      - run: make setup
      - name: Install pinned kind and kubectl (checksum-verified)
        run: |
          make tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Create cluster, check allowlist, get nodes
        run: make cluster
      - name: Delete cluster
        if: always()
        run: make cluster-down
