[project]
name = "triage"
version = "0.1.0"
description = "Kubernetes incident-triage agent and the production harness around it"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = "==3.12.*"
# Exact pins: uv.lock pins the transitive tree with hashes; these make upgrades explicit.
dependencies = [
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "shellcheck-py==0.11.0.1",  # bundles the shellcheck binary, so `make lint` needs no system package
    "types-pyyaml==6.0.12.20261103",
    "yamllint==1.38.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.11.32"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # pyupgrade
    "S",            # bandit (security)
    "SIM",          # simplify
    "PTH",          # prefer pathlib
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, run subprocesses and write temp files by design.
"tests/**" = ["S101", "S603", "S108"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
